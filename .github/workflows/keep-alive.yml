name: Keep Render Backend Active

on:
  schedule:
    # Runs every 14 minutes during active hours (06:00 to 22:00 UTC / UK time).
    # Sleeps for 8 hours overnight (22:00 to 06:00 UTC), consuming ~496 hours/month.
    # This prevents hitting Render's 750 free instance hours limit with a ~254h safety buffer!
    - cron: '*/14 6-21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          TARGET="${{ secrets.BACKEND_URL || vars.BACKEND_URL || 'https://weather-activity-wind-turbulance.onrender.com' }}"
          # Remove trailing slash if present
          TARGET="${TARGET%/}"
          echo "Pinging ${TARGET}/api/health ..."
          curl -sS -m 60 "${TARGET}/api/health" || echo "Ping sent (service may currently be waking up)"
