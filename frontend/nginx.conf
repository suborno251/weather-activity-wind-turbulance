server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the backend container (name it "backend" in docker-compose).
  location /api/ {
    proxy_pass http://backend:8000;
  }

  # Proxy Swagger UI, ReDoc, and OpenAPI documentation
  location ~ ^/(docs|openapi.json|redoc|swagger) {
    proxy_pass http://backend:8000;
  }

  location / {
    try_files $uri /index.html;
  }
}
